<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>LeVer · Starfield Close</title>
  <style>
    html,body{margin:0;padding:0;background:#000}body{height:100%}
    #scene{position:fixed;inset:0;width:100vw;height:100vh;display:block}
    #scroll-host{height:300vh}
    .hint{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);font:10px system-ui;letter-spacing:3px;color:#eafff2;opacity:.6}
    html.embedded #scroll-host,html.embedded .hint{display:none}
    html.embedded{overflow:hidden}
    #fallback{display:none;position:fixed;inset:0;background:radial-gradient(ellipse at 0% 100%,#c79bff22,transparent 60%),#0a0a24}
  </style>
  <script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.143.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.143.0/examples/jsm/"}}</script>
</head>
<body>
<canvas id="scene" aria-label="Mint and jade stars drifting through space"></canvas>
<div id="fallback"></div><div id="scroll-host"></div><span class="hint">SCROLL ↓</span>
<script type="module">
const embedded = new URLSearchParams(location.search).has('embed');
document.documentElement.classList.toggle('embedded', embedded);
const CONFIG = {
  bgColor:'#0a0a24',flameColor:'#aee9ff',flameColor2:'#c79bff',flameAmt:0.2,
  colorA:'#aef6cf',colorB:'#5fe6a0',colorC:'#eafff2',opacity:2,pointSize:50,
  brightness:1.85,drift:2.35,twinkle:1,spin:0.03,repelRadius:5,repelStrength:0.35,
  scrollPush:8,scrollDrift:6,scrollSpin:0.1,parallax:0.6,
};
try {
const THREE = await import('three');
const [{EffectComposer},{RenderPass},{ShaderPass},{UnrealBloomPass},{GammaCorrectionShader},{CopyShader}] = await Promise.all([
  import('three/addons/postprocessing/EffectComposer.js'),import('three/addons/postprocessing/RenderPass.js'),
  import('three/addons/postprocessing/ShaderPass.js'),import('three/addons/postprocessing/UnrealBloomPass.js'),
  import('three/addons/shaders/GammaCorrectionShader.js'),import('three/addons/shaders/CopyShader.js'),
]);
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGL1Renderer({canvas,antialias:true});
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(innerWidth,innerHeight,false);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.VSMShadowMap;
const scene = new THREE.Scene();scene.background=new THREE.Color(0x000000);scene.fog=new THREE.Fog(0x000000,0,15);
const camera = new THREE.PerspectiveCamera(45,innerWidth/innerHeight,0.1,80);camera.position.set(0,0,5);
const LAYERS={NONE:0,TORUS_SCENE:1,BLOOM_SCENE:2,ENTIRE_SCENE:3};
camera.layers.enable(LAYERS.TORUS_SCENE);camera.layers.enable(LAYERS.BLOOM_SCENE);camera.layers.enable(LAYERS.ENTIRE_SCENE);scene.add(camera);
function hexToVec3(hex){const n=parseInt(hex.slice(1),16);return new THREE.Vector3(((n>>16)&255)/255,((n>>8)&255)/255,(n&255)/255);}
const renderScene=new RenderPass(scene,camera);
const torusComposer=new EffectComposer(renderer);torusComposer.renderToScreen=false;
torusComposer.addPass(renderScene);torusComposer.addPass(new ShaderPass(GammaCorrectionShader));
const torusBloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),0.22,0.2,0);
torusComposer.addPass(torusBloom);torusComposer.addPass(new ShaderPass(CopyShader));
const bloomComposer=new EffectComposer(renderer);bloomComposer.renderToScreen=false;
bloomComposer.addPass(renderScene);
const starBloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),0.4,0.55,0);
bloomComposer.addPass(starBloom);bloomComposer.addPass(new ShaderPass(GammaCorrectionShader));
const finalComposer=new EffectComposer(renderer);finalComposer.addPass(renderScene);
const finalPass=new ShaderPass({
  uniforms:{iTime:{value:0},tDiffuse:{value:null},torusTexture:{value:null},bloomTexture:{value:null},haloTexture:{value:null},
    uBg:{value:hexToVec3(CONFIG.bgColor)},uFlameA:{value:hexToVec3(CONFIG.flameColor)},uFlameB:{value:hexToVec3(CONFIG.flameColor2)},uFlameAmt:{value:CONFIG.flameAmt}},
  vertexShader:`varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position, 1.0); }`,
  fragmentShader:`uniform float iTime; uniform sampler2D tDiffuse; uniform sampler2D bloomTexture; uniform sampler2D torusTexture; uniform sampler2D haloTexture;
uniform vec3 uBg; uniform vec3 uFlameA; uniform vec3 uFlameB; uniform float uFlameAmt;
varying vec2 vUv;
vec3 warp3d(vec3 pos, float t){ float curv=.8,a=1.9,b=0.7; pos*=2.;
  pos.x+=curv*sin(t+a*pos.y)+t*b; pos.y+=curv*cos(t+a*pos.x);
  pos.y+=curv*sin(t+a*pos.z)+t*b; pos.z+=curv*cos(t+a*pos.y);
  pos.z+=curv*sin(t+a*pos.x)+t*b; pos.x+=curv*cos(t+a*pos.z);
  return 0.5+0.5*cos(pos.xyz+vec3(1,2,4)); }
void main(){
  vec2 uv = 2.*vUv - 1.;
  vec3 w = pow(warp3d(vec3(uv.x, sin(uv.y), uv.y), iTime*1.5), vec3(1.5));
  vec3 flame = 1.5*uFlameA*w.x; flame*=w.y; flame += uFlameB*w.z;
  flame *= smoothstep(0.25, 1., abs(uv.y));
  float md = smoothstep(-0.7, 1., -uv.y*uv.x); flame *= md*md;
  vec3 bg = uBg * (1.0 - 0.4 * length(uv));
  vec3 halo = texture2D(haloTexture, vUv).xyz;
  gl_FragColor = vec4(bg + flame*uFlameAmt + texture2D(bloomTexture, vUv).xyz + texture2D(torusTexture, vUv).xyz + texture2D(tDiffuse, vUv).xyz + halo, 1.);
}`,
});
finalPass.uniforms.bloomTexture.value=bloomComposer.renderTarget1.texture;
finalPass.uniforms.torusTexture.value=torusComposer.renderTarget1.texture;
finalComposer.addPass(finalPass);
const count=4200,depth=30;
const positions=new Float32Array(count*3),palette=new Float32Array(count),bright=new Float32Array(count),scales=new Float32Array(count),phases=new Float32Array(count);
for(let i=0;i<count;i++){
  const i3=i*3;
  positions[i3]=(Math.random()-0.5)*24;positions[i3+1]=(Math.random()-0.5)*16;positions[i3+2]=(Math.random()-0.5)*30;
  palette[i]=Math.floor(Math.random()*3);bright[i]=0.7+Math.random()*0.6;
  scales[i]=0.5+Math.pow(Math.random(),1.4)*2.5;phases[i]=Math.random();
}
const geometry=new THREE.BufferGeometry();
geometry.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));
geometry.setAttribute('aScale',new THREE.Float32BufferAttribute(scales,1));geometry.setAttribute('aPhase',new THREE.Float32BufferAttribute(phases,1));
geometry.setAttribute('aPalette',new THREE.Float32BufferAttribute(palette,1));geometry.setAttribute('aBright',new THREE.Float32BufferAttribute(bright,1));
const material=new THREE.ShaderMaterial({transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
  uniforms:{uTime:{value:0},uSize:{value:50},uOpacity:{value:0},uDrift:{value:0},uDepth:{value:30},uTwinkle:{value:1},
    uCursor:{value:new THREE.Vector3()},uRepelRadius:{value:5},uRepelStrength:{value:0.35},uActivity:{value:0},
    uColorA:{value:hexToVec3('#aef6cf')},uColorB:{value:hexToVec3('#5fe6a0')},uColorC:{value:hexToVec3('#eafff2')},uBrightness:{value:1.85}},
  vertexShader:`uniform float uTime; uniform float uSize; uniform float uDrift; uniform float uDepth; uniform float uTwinkle;
uniform vec3 uCursor; uniform float uRepelRadius; uniform float uRepelStrength; uniform float uActivity;
uniform vec3 uColorA; uniform vec3 uColorB; uniform vec3 uColorC;
attribute float aScale; attribute float aPhase; attribute float aPalette; attribute float aBright;
varying vec3 vColor; varying float vTwinkle;
void main() {
  vec3 pos = position;
  // Endless drift toward +Z with mod-wrap.
  pos.z = mod(pos.z + uDrift + (uDepth * 0.5), uDepth) - (uDepth * 0.5);

  float tw = sin(uTime * 1.6 + aPhase * 6.2831);
  vTwinkle = (1.0 - uTwinkle) + uTwinkle * (0.55 + 0.45 * tw);

  vec4 modelPosition = modelMatrix * vec4(pos, 1.0);

  vec3 toParticle = modelPosition.xyz - uCursor;
  float dist = length(toParticle);
  float falloff = smoothstep(uRepelRadius, 0.0, dist);
  modelPosition.xyz += normalize(toParticle + vec3(0.0001)) * falloff * uRepelStrength * uActivity;

  vec4 viewPosition = viewMatrix * modelPosition;
  gl_Position = projectionMatrix * viewPosition;
  gl_PointSize = uSize * aScale;
  gl_PointSize *= (1.0 / -viewPosition.z);

  vec3 base = aPalette < 0.5 ? uColorA : (aPalette < 1.5 ? uColorB : uColorC);
  vColor = base * aBright;
}`,
  fragmentShader:`uniform float uOpacity; uniform float uBrightness;
varying vec3 vColor; varying float vTwinkle;
void main() {
  vec2 uv = gl_PointCoord - 0.5;
  float d = length(uv);
  if (d > 0.5) discard;
  float strength = pow(1.0 - d * 2.0, 4.0);
  vec3 color = mix(vec3(0.0), vColor, strength);
  gl_FragColor = vec4(color * uBrightness, strength * uOpacity * vTwinkle);
}`,
});
const group=new THREE.Group();scene.add(group);
const points=new THREE.Points(geometry,material);points.layers.enable(LAYERS.ENTIRE_SCENE);group.add(points);
const POINTER={ndc:new THREE.Vector2(),world:new THREE.Vector3(),active:false,lastMove:0,activity:0};
const target=new THREE.Vector3(),ray=new THREE.Vector3(),mouseSmooth=new THREE.Vector2();
let scrollTarget=0,scrollSmooth=0,scrollCurrent=0;
const clamp=THREE.MathUtils.clamp,lerp=THREE.MathUtils.lerp;
function pointer(x,y){POINTER.ndc.set(x,y);POINTER.active=true;POINTER.lastMove=performance.now();}
function onMouse(event){pointer(event.clientX/innerWidth*2-1,-(event.clientY/innerHeight*2-1));}
function onMouseOut(event){if(!event.relatedTarget)POINTER.active=false;}
function onScroll(){if(!embedded)scrollTarget=clamp(scrollY/Math.max(1,document.documentElement.scrollHeight-innerHeight),0,1);}
function updatePointer(now){
  target.set(0,0,0);
  if(POINTER.active){
    ray.set(POINTER.ndc.x,POINTER.ndc.y,0.5).unproject(camera).sub(camera.position).normalize();
    const distance=-camera.position.z/ray.z;
    if(Math.abs(ray.z)>1e-4&&distance>0&&Number.isFinite(distance))target.copy(camera.position).addScaledVector(ray,distance);
  }
  POINTER.world.lerp(target,0.12);
  const idle=(now-POINTER.lastMove)/1000,want=(POINTER.active&&idle<3)?1:0;
  POINTER.activity+=(want-POINTER.activity)*0.06;
  material.uniforms.uCursor.value.copy(POINTER.world);material.uniforms.uActivity.value=POINTER.activity;
}
const reducedMotion=matchMedia('(prefers-reduced-motion: reduce)');
let paused=false,frame=0,disposed=false,t0=performance.now()/1000;
const appearStart=performance.now();
function render(now){
  frame=0;if(disposed||document.hidden||paused)return;
  const reduced=reducedMotion.matches,t=now/1000,dt=reduced?0:Math.min(0.05,t-t0);t0=t;
  if(!reduced){
    scrollSmooth=lerp(scrollSmooth,scrollTarget,0.10);scrollCurrent=lerp(scrollCurrent,scrollSmooth,0.06);
    mouseSmooth.lerp(POINTER.ndc,0.06);updatePointer(now);
  }
  material.uniforms.uTime.value=reduced?0:t;
  material.uniforms.uDrift.value+=dt*(CONFIG.drift+scrollCurrent*CONFIG.scrollDrift);
  camera.position.set(mouseSmooth.x*0.6,mouseSmooth.y*0.6,5-scrollCurrent*8);
  camera.lookAt(mouseSmooth.x*0.6,mouseSmooth.y*0.6,-10);
  material.uniforms.uOpacity.value=(reduced?1:clamp((now-appearStart-300)/1400,0,1))*2;
  group.rotation.z+=dt*(CONFIG.spin+scrollCurrent*CONFIG.scrollSpin);
  finalPass.uniforms.iTime.value=reduced?0:t;
  camera.layers.set(LAYERS.TORUS_SCENE);torusComposer.render();
  camera.layers.set(LAYERS.BLOOM_SCENE);bloomComposer.render();
  camera.layers.set(LAYERS.ENTIRE_SCENE);finalComposer.render();
  if(!reduced)frame=requestAnimationFrame(render);
}
function start(){cancelAnimationFrame(frame);t0=performance.now()/1000;render(performance.now());}
function resize(){
  renderer.setPixelRatio(window.devicePixelRatio);renderer.setSize(innerWidth,innerHeight,false);
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  for(const composer of [torusComposer,bloomComposer,finalComposer]){composer.setPixelRatio(window.devicePixelRatio);composer.setSize(innerWidth,innerHeight);}
  onScroll();if(reducedMotion.matches)start();
}
function onMessage(event){
  if(!embedded||event.source!==parent||event.origin!==location.origin||event.data?.type!=='lever:starfield')return;
  const data=event.data;
  if(Number.isFinite(data.x)&&Number.isFinite(data.y))pointer(clamp(data.x,-1,1),clamp(data.y,-1,1));
  if(data.active===false)POINTER.active=false;
  if(Number.isFinite(data.scroll))scrollTarget=clamp(data.scroll,0,1);
  if(typeof data.paused==='boolean'&&data.paused!==paused){paused=data.paused;if(paused)cancelAnimationFrame(frame);else start();}
}
function onVisibility(){if(document.hidden)cancelAnimationFrame(frame);else start();}
function dispose(){
  disposed=true;cancelAnimationFrame(frame);
  removeEventListener('mousemove',onMouse);removeEventListener('mouseout',onMouseOut);removeEventListener('scroll',onScroll);
  removeEventListener('resize',resize);removeEventListener('message',onMessage);document.removeEventListener('visibilitychange',onVisibility);
  reducedMotion.removeEventListener('change',start);geometry.dispose();material.dispose();
  const passes=new Set([...torusComposer.passes,...bloomComposer.passes,...finalComposer.passes]);
  for(const pass of passes)pass.dispose?.();
  for(const composer of [torusComposer,bloomComposer,finalComposer]){composer.renderTarget1.dispose();composer.renderTarget2.dispose();composer.copyPass.dispose();}
  renderer.dispose();
}
addEventListener('mousemove',onMouse,{passive:true});addEventListener('mouseout',onMouseOut);
addEventListener('scroll',onScroll,{passive:true});addEventListener('resize',resize);addEventListener('message',onMessage);
document.addEventListener('visibilitychange',onVisibility);reducedMotion.addEventListener('change',start);
addEventListener('pagehide',dispose,{once:true});
canvas.addEventListener('webglcontextlost',event=>{event.preventDefault();cancelAnimationFrame(frame);document.getElementById('fallback').style.display='block';});
canvas.addEventListener('webglcontextrestored',()=>{document.getElementById('fallback').style.display='none';start();});
resize();start();if(embedded)parent.postMessage({type:'lever:starfield-ready'},location.origin);
} catch(error) {
  document.getElementById('fallback').style.display='block';
  console.warn('Starfield unavailable; using a static background.',error);
}
</script>
</body>
</html>
