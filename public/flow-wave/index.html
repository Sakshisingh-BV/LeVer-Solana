<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#02160c">
  <title>LeVer · Flow Wave</title>
  <style>
    html,body{margin:0;padding:0;background:#000}#scene{position:fixed;inset:0;width:100vw;height:100vh;display:block}
    #scroll-host{height:620vh}#scroll-hint{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);font:11px system-ui;letter-spacing:3px;color:#aef0c0;opacity:.5}
    html.embedded #scroll-host,html.embedded #scroll-hint{display:none}html.embedded{overflow:hidden}
    #fallback{display:none;position:fixed;inset:0;background:radial-gradient(ellipse at 85% 70%,#16492d,#02160c 70%)}
  </style>
  <script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.143.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.143.0/examples/jsm/"}}</script>
</head>
<body>
<canvas id="scene" aria-label="Emerald particle hills flowing under a drifting atmosphere"></canvas><div id="fallback"></div><div id="scroll-host"></div><div id="scroll-hint">scroll ↓</div>
<script type="module">
const embedded = new URLSearchParams(location.search).has('embed');
document.documentElement.classList.toggle('embedded', embedded);
try {
const THREE = await import('three');
const [{ EffectComposer }, { RenderPass }, { UnrealBloomPass }, { ShaderPass }, { GammaCorrectionShader }, { CopyShader }] = await Promise.all([
  import('three/addons/postprocessing/EffectComposer.js'), import('three/addons/postprocessing/RenderPass.js'),
  import('three/addons/postprocessing/UnrealBloomPass.js'), import('three/addons/postprocessing/ShaderPass.js'),
  import('three/addons/shaders/GammaCorrectionShader.js'), import('three/addons/shaders/CopyShader.js'),
]);
const bgColor       = '#02160c'   // FinalPass background tint
const flameColor    = '#0aff7f'   // corner-flame A
const flameColor2   = '#aef0c0'   // corner-flame B
const flameAmt      = 0.2         // corner-flame intensity
const atmoColor     = '#7affbf'   // ambient motes color
const atmoCount     = 300         // mote count
const atmoSize      = 24          // mote base size
const atmoSpeed     = 1.0         // mote warp speed
const colorLow      = '#02160c'   // points low color
const colorHigh     = '#34e89a'   // points high color
const opacity       = 0.26        // point opacity
const pointSize     = 5.5         // point base size
const brightness    = 0.45        // point color multiplier
const waveHeight    = 3           // base swell amplitude
const flow          = 1           // noise scroll speed
const tilt          = 0           // sheet X rotation (negated)
const scale         = 0.275       // shrinks the sheet to frame
const scrollRise    = 1.0         // swell amplitude growth on scroll
const camStartY     = 7,  camStartZ = 16   // scroll 0 camera
const camEndY       = 0.8, camEndZ  = -2   // scroll 1 camera
const lookStartZ    = 2,  lookEndZ  = -16  // look-target pan
const parallax      = 1.2
const pointerRadius   = 7.0
const pointerStrength = 0.9
const Lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
function hexToVec3(hex) {
  const n = parseInt(hex.slice(1), 16);
  return new THREE.Vector3(((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255);
}
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGL1Renderer({ canvas, antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.VSMShadowMap;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x000000); scene.fog = new THREE.Fog(0x000000, 0, 15);
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 400); camera.position.set(0, 7, 16);
const LAYERS = { NONE: 0, TORUS_SCENE: 1, BLOOM_SCENE: 2, ENTIRE_SCENE: 3 };
camera.layers.enable(LAYERS.TORUS_SCENE); camera.layers.enable(LAYERS.BLOOM_SCENE); camera.layers.enable(LAYERS.ENTIRE_SCENE); scene.add(camera);
const renderPass = new RenderPass(scene, camera);
const torusComposer = new EffectComposer(renderer); torusComposer.renderToScreen = false;
torusComposer.addPass(renderPass); torusComposer.addPass(new ShaderPass(GammaCorrectionShader));
torusComposer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.22, 0.2, 0)); torusComposer.addPass(new ShaderPass(CopyShader));
const bloomComposer = new EffectComposer(renderer); bloomComposer.renderToScreen = false;
bloomComposer.addPass(renderPass); bloomComposer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.4, 0.55, 0)); bloomComposer.addPass(new ShaderPass(GammaCorrectionShader));
const finalComposer = new EffectComposer(renderer); finalComposer.addPass(renderPass);
const finalPass = new ShaderPass({
  uniforms: { iTime: { value: 0 }, tDiffuse: { value: null }, torusTexture: { value: null }, bloomTexture: { value: null }, haloTexture: { value: null }, uBg: { value: hexToVec3(bgColor) }, uFlameA: { value: hexToVec3(flameColor) }, uFlameB: { value: hexToVec3(flameColor2) }, uFlameAmt: { value: flameAmt } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position, 1.0); }`,
  fragmentShader: `uniform float iTime; uniform sampler2D tDiffuse; uniform sampler2D bloomTexture; uniform sampler2D torusTexture; uniform sampler2D haloTexture;
uniform vec3 uBg; uniform vec3 uFlameA; uniform vec3 uFlameB; uniform float uFlameAmt;
varying vec2 vUv;
vec3 warp3d(vec3 pos, float t){ float curv=.8,a=1.9,b=0.7; pos*=2.;
  pos.x+=curv*sin(t+a*pos.y)+t*b; pos.y+=curv*cos(t+a*pos.x);
  pos.y+=curv*sin(t+a*pos.z)+t*b; pos.z+=curv*cos(t+a*pos.y);
  pos.z+=curv*sin(t+a*pos.x)+t*b; pos.x+=curv*cos(t+a*pos.z);
  return 0.5+0.5*cos(pos.xyz+vec3(1,2,4)); }
void main(){
  vec2 uv = 2.*vUv - 1.;
  vec3 w = pow(warp3d(vec3(uv.x, sin(uv.y), uv.y), iTime*1.5), vec3(1.5));
  vec3 flame = 1.5*uFlameA*w.x; flame*=w.y; flame += uFlameB*w.z;
  flame *= smoothstep(0.25, 1., abs(uv.y));
  float md = smoothstep(-0.7, 1., -uv.y*uv.x); flame *= md*md;
  vec3 bg = uBg * (1.0 - 0.4 * length(uv));
  vec3 halo = texture2D(haloTexture, vUv).xyz;
  gl_FragColor = vec4(bg + flame*uFlameAmt + texture2D(bloomTexture, vUv).xyz + texture2D(torusTexture, vUv).xyz + texture2D(tDiffuse, vUv).xyz + halo, 1.);
}`,
});
finalPass.uniforms.bloomTexture.value = bloomComposer.renderTarget1.texture;
finalPass.uniforms.torusTexture.value = torusComposer.renderTarget1.texture;
finalComposer.addPass(finalPass);
const SNOISE = `vec4 permute(vec4 x){return mod(((x*34.0)+1.0)*x, 289.0);}
vec4 taylorInvSqrt(vec4 r){return 1.79284291400159 - 0.85373472095314 * r;}
float snoise(vec3 v){
  const vec2 C = vec2(1.0/6.0, 1.0/3.0); const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
  vec3 i = floor(v + dot(v, C.yyy)); vec3 x0 = v - i + dot(i, C.xxx);
  vec3 g = step(x0.yzx, x0.xyz); vec3 l = 1.0 - g;
  vec3 i1 = min(g.xyz, l.zxy); vec3 i2 = max(g.xyz, l.zxy);
  vec3 x1 = x0 - i1 + 1.0 * C.xxx; vec3 x2 = x0 - i2 + 2.0 * C.xxx; vec3 x3 = x0 - 1.0 + 3.0 * C.xxx;
  i = mod(i, 289.0);
  vec4 p = permute(permute(permute(i.z + vec4(0.0, i1.z, i2.z, 1.0)) + i.y + vec4(0.0, i1.y, i2.y, 1.0)) + i.x + vec4(0.0, i1.x, i2.x, 1.0));
  float n_ = 1.0/7.0; vec3 ns = n_ * D.wyz - D.xzx;
  vec4 j = p - 49.0 * floor(p * ns.z *ns.z);
  vec4 x_ = floor(j * ns.z); vec4 y_ = floor(j - 7.0 * x_);
  vec4 x = x_ *ns.x + ns.yyyy; vec4 y = y_ *ns.x + ns.yyyy; vec4 h = 1.0 - abs(x) - abs(y);
  vec4 b0 = vec4(x.xy, y.xy); vec4 b1 = vec4(x.zw, y.zw);
  vec4 s0 = floor(b0)*2.0 + 1.0; vec4 s1 = floor(b1)*2.0 + 1.0; vec4 sh = -step(h, vec4(0.0));
  vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy; vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;
  vec3 p0 = vec3(a0.xy,h.x); vec3 p1 = vec3(a0.zw,h.y); vec3 p2 = vec3(a1.xy,h.z); vec3 p3 = vec3(a1.zw,h.w);
  vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2, p2), dot(p3,p3)));
  p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
  vec4 m = max(0.5 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0); m = m * m;
  return 42.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
}`;
const uniforms = {
  uTime: { value: 0 }, uStream: { value: 0 }, uAppear: { value: 0 },
  uColLow: { value: hexToVec3(colorLow) }, uColHigh: { value: hexToVec3(colorHigh) },
  uOpacity: { value: opacity }, uSize: { value: pointSize }, uBrightness: { value: brightness },
  uWaveHeight: { value: waveHeight }, uFlow: { value: flow }, uScale: { value: scale },
  uCursor: { value: new THREE.Vector3() }, uRepelRadius: { value: pointerRadius }, uRepelStrength: { value: pointerStrength }, uActivity: { value: 0 },
};
const material = new THREE.ShaderMaterial({ uniforms, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `uniform float uTime; uniform float uStream; uniform float uSize; uniform float uWaveHeight; uniform float uFlow; uniform float uScale;
uniform vec3 uColLow; uniform vec3 uColHigh;
uniform vec3 uCursor; uniform float uRepelRadius; uniform float uRepelStrength; uniform float uActivity;
varying float vFade; varying vec3 vColor;
${SNOISE}
void main() {
  vec3 wp = vec3(position.x * 13.0, 0.0, position.z * 25.0);
  wp.x += position.y * 6.0;
  // uStream slides the sampled hills toward the camera (forward flight).
  float zc = wp.z + uStream;
  float wn = snoise(vec3(wp.x * 0.08, zc * 0.08, uTime * 0.15 * uFlow)) * 2.0;
  wn += snoise(vec3(wp.x * 0.16, zc * 0.16, uTime * 0.3 * uFlow)) * 0.8;
  wp.y += wn * uWaveHeight;

  vec3 finalPos = wp * uScale;
  vec4 modelPosition = modelMatrix * vec4(finalPos, 1.0);
  vec3 toP = modelPosition.xyz - uCursor;
  float cd = length(toP);
  float fall = smoothstep(uRepelRadius, 0.0, cd);
  modelPosition.xyz += normalize(toP + vec3(0.0001)) * fall * uRepelStrength * uActivity;
  vec4 mvPosition = viewMatrix * modelPosition;

  float colMix = smoothstep(-3.0, 3.0, position.y + position.x * 0.5);
  vColor = mix(uColLow, uColHigh, clamp(colMix, 0.0, 1.0));
  vFade = 1.0;

  gl_PointSize = uSize * (10.0 / -mvPosition.z);
  gl_PointSize = max(gl_PointSize, 1.5);
  gl_Position = projectionMatrix * mvPosition;
}`, fragmentShader: `uniform float uOpacity; uniform float uBrightness; uniform float uAppear;
varying float vFade; varying vec3 vColor;
void main() {
  vec2 xy = gl_PointCoord - 0.5;
  float ll = length(xy);
  if (ll > 0.5) discard;
  float a = smoothstep(0.5, 0.1, ll);
  gl_FragColor = vec4(vColor * uBrightness, vFade * a * uOpacity * uAppear);
}`,
});
const points = new THREE.Points(new THREE.SphereGeometry(4.2, 200, 600), material);
points.frustumCulled = false; points.layers.enable(LAYERS.ENTIRE_SCENE);
const group = new THREE.Group(); group.add(points); scene.add(group);
let atmoMat;
(() => {
  const N = Math.round(atmoCount), positions = new Float32Array(N * 3), sizes = new Float32Array(N), seeds = new Float32Array(N);
  for (let i = 0; i < N; i++) {
    positions[i * 3] = 2 * Math.random() - 1; positions[i * 3 + 1] = 2 * Math.random() - 1; positions[i * 3 + 2] = 2 * Math.random() - 1;
    sizes[i] = atmoSize * (0.4 + Math.random()); seeds[i] = Math.random();
  }
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3)); geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1)); geometry.setAttribute('seed', new THREE.BufferAttribute(seeds, 1));
  atmoMat = new THREE.ShaderMaterial({ transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, depthTest: false,
    uniforms: { uTime: { value: 0 }, uColor: { value: hexToVec3(atmoColor) }, uRes: { value: new THREE.Vector2(innerWidth * devicePixelRatio, innerHeight * devicePixelRatio) } },
    vertexShader: `attribute float size; attribute float seed; uniform float uTime; uniform vec2 uRes;
varying float vA;
vec3 warp(vec3 p, float t){ float c=0.9,a=1.9,b=0.02,s=0.05; p*=2.;
  p.x+=c*sin(s*t+a*p.y)+t*b; p.y+=c*cos(s*t+a*p.x); p.y+=c*sin(s*t+a*p.z)+t*b;
  p.z+=c*cos(s*t+a*p.y); p.z+=c*sin(s*t+a*p.x)+t*b; p.x+=c*cos(s*t+a*p.z);
  return cos(p+vec3(1,2,4)); }
void main(){
  vec3 v = position*4.0 + warp(position, uTime)*1.2;
  vec4 mv = modelViewMatrix * vec4(v, 1.0);
  float r = length(v); float farF = 1.0 - smoothstep(5.0, 6.5, r); float nearF = smoothstep(0.0, 0.5, -mv.z);
  vA = farF * nearF;
  gl_PointSize = size * uRes.y / 900.0 / -mv.z; gl_PointSize = max(gl_PointSize, 1.0);
  gl_Position = projectionMatrix * mv;
}`, fragmentShader: `uniform vec3 uColor; varying float vA;
void main(){ vec2 p = gl_PointCoord - 0.5; float l = length(p); if (l > 0.5) discard;
  float tex = smoothstep(0.5, 0.0, l); gl_FragColor = vec4(uColor * tex, tex * vA * 0.6); }`,
  });
  const pts = new THREE.Points(geometry, atmoMat); pts.frustumCulled = false; pts.layers.enable(LAYERS.ENTIRE_SCENE); scene.add(pts);
  pts.onBeforeRender = () => { const t = performance.now() / 1000; atmoMat.uniforms.uTime.value = t * atmoSpeed * 8.0; pts.position.copy(camera.position); finalPass.uniforms.iTime.value = t; };
})();
let scrollTarget = 0, scrollSmooth = 0, scrollCurrent = 0;
const mouseTarget = { x: 0, y: 0 }, mouse = { x: 0, y: 0 };
const POINTER = { world: new THREE.Vector3(), activity: 0, active: false, lastMove: performance.now() };
const _ndc = new THREE.Vector3(), _dir = new THREE.Vector3(), _tgt = new THREE.Vector3();
function updatePointerWorld() {
  _tgt.set(0, 0, 0)
  if (POINTER.active) {
    _ndc.set(mouse.x, mouse.y, 0.5).unproject(camera)
    _dir.copy(_ndc).sub(camera.position).normalize()
    const dn = _dir.z
    if (Math.abs(dn) > 1e-4) { const tt = -camera.position.z / dn; if (tt > 0 && Number.isFinite(tt)) _tgt.copy(camera.position).addScaledVector(_dir, tt) }
  }
  POINTER.world.lerp(_tgt, 0.12)
  const idle = (performance.now() - POINTER.lastMove) / 1000
  POINTER.activity += (((POINTER.active && idle < 3) ? 1 : 0) - POINTER.activity) * 0.06
}

function updateScroll() { if (!embedded) { const max = document.documentElement.scrollHeight - innerHeight; scrollTarget = max > 0 ? clamp(scrollY / max, 0, 1) : 0; } }
window.addEventListener('scroll', updateScroll, { passive: true });
window.addEventListener('mousemove', event => { mouseTarget.x = (event.clientX / innerWidth) * 2 - 1; mouseTarget.y = -((event.clientY / innerHeight) * 2 - 1); POINTER.active = true; POINTER.lastMove = performance.now(); }, { passive: true });
window.addEventListener('mouseout', event => { if (!event.relatedTarget) POINTER.active = false; });
const sceneObj = {
  stream: 0, appearStart: performance.now(), t0: performance.now() / 1000,
  render(scroll, m) {
const t = performance.now() / 1000
const dt = Math.min(0.05, t - this.t0); this.t0 = t
uniforms.uTime.value = t

// Stream the hills toward us at a constant rate; grow the swell with scroll.
this.stream += dt * (flow * 2.0) * 4.0
uniforms.uStream.value = this.stream
uniforms.uWaveHeight.value = waveHeight * (1 + scroll * scrollRise)

// Camera fly-path: smoothstep over the first 35% of scroll.
const ea = Math.min(scroll / 0.35, 1.0)
const e = ea * ea * (3 - 2 * ea)
const camY = Lerp(camStartY, camEndY, e)
const camZ = Lerp(camStartZ, camEndZ, e)
camera.position.set(m.x * parallax, camY + m.y * parallax * 0.3, camZ)
camera.lookAt(m.x * parallax * 0.5, Lerp(0.0, 0.6, e), Lerp(lookStartZ, lookEndZ, e))
group.rotation.x = -tilt
group.rotation.y = 0
updatePointerWorld()

uniforms.uCursor.value.copy(POINTER.world)
uniforms.uActivity.value = POINTER.activity
const elapsed = (performance.now() - this.appearStart) / 1000
uniforms.uAppear.value = Math.max(0, Math.min(1, (elapsed - 0.2) / 1.4))   // 0.2s delay, 1.4s fade-in
  },
};
let frame = 0, paused = false, disposed = false;
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
function render() {
  frame = 0; if (disposed || document.hidden || paused) return;
  scrollSmooth = Lerp(scrollSmooth, scrollTarget, 0.10); scrollCurrent = Lerp(scrollCurrent, scrollSmooth, 0.06);
  mouse.x = Lerp(mouse.x, mouseTarget.x, 0.06); mouse.y = Lerp(mouse.y, mouseTarget.y, 0.06);
  sceneObj.render(scrollCurrent, mouse);
  if (reducedMotion.matches) uniforms.uAppear.value = 1;
  camera.layers.set(LAYERS.TORUS_SCENE); torusComposer.render();
  camera.layers.set(LAYERS.BLOOM_SCENE); bloomComposer.render();
  camera.layers.set(LAYERS.ENTIRE_SCENE); finalComposer.render();
  if (!reducedMotion.matches) frame = requestAnimationFrame(render);
}
function wake() { if (!frame && !disposed && !document.hidden && !paused) { sceneObj.t0 = performance.now() / 1000; frame = requestAnimationFrame(render); } }
function resize() {
  const w = innerWidth, h = innerHeight, dpr = devicePixelRatio;
  renderer.setPixelRatio(dpr); renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  for (const composer of [torusComposer, bloomComposer, finalComposer]) { composer.setPixelRatio(dpr); composer.setSize(w, h); }
  atmoMat.uniforms.uRes.value.set(w * dpr, h * dpr); updateScroll(); wake();
}
window.addEventListener('resize', resize);
document.addEventListener('visibilitychange', wake);
reducedMotion.addEventListener('change', wake);
window.addEventListener('message', event => {
  if (!embedded || event.origin !== location.origin || event.source !== parent || event.data?.type !== 'lever:flow-wave') return;
  const data = event.data;
  if (Number.isFinite(data.scroll)) scrollTarget = clamp(data.scroll, 0, 1);
  if (Number.isFinite(data.x) && Number.isFinite(data.y)) { mouseTarget.x = clamp(data.x, -1, 1); mouseTarget.y = clamp(data.y, -1, 1); POINTER.active = true; POINTER.lastMove = performance.now(); }
  if (data.active === false) POINTER.active = false;
  if (typeof data.paused === 'boolean') { paused = data.paused; if (paused && frame) { cancelAnimationFrame(frame); frame = 0; } else if (!reducedMotion.matches) wake(); }
});
canvas.addEventListener('webglcontextlost', event => { event.preventDefault(); paused = true; if (frame) cancelAnimationFrame(frame); frame = 0; document.getElementById('fallback').style.display = 'block'; });
canvas.addEventListener('webglcontextrestored', () => location.reload());
window.addEventListener('pagehide', () => { disposed = true; cancelAnimationFrame(frame); scene.traverse(object => { object.geometry?.dispose(); object.material?.dispose(); }); for (const composer of [torusComposer, bloomComposer, finalComposer]) { for (const pass of composer.passes) pass.dispose?.(); composer.dispose?.(); } renderer.dispose(); }, { once: true });
resize();
if (embedded) parent.postMessage({ type: 'lever:flow-wave-ready' }, location.origin);
} catch (error) { console.error('Flow Wave could not initialize:', error); document.getElementById('fallback').style.display = 'block'; }
</script>
</body>
</html>
